<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MusicFlow">
<link rel="manifest" href="/music/manifest.json">
<link rel="icon" href="/music/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/music/icon-192.png">
<title>MusicFlow</title>
<style>
:root{--a:#b6ff3b;--bg:#060806;--tx:#f1f7ec;--sub:#7d8c79;
  --sf:color-mix(in srgb,var(--bg) 84%,#fff);--sf2:color-mix(in srgb,var(--bg) 74%,#fff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.hidden{display:none !important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;overflow:hidden;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button,input{font:inherit;color:inherit}
button{background:var(--sf2);border:0;border-radius:12px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
button:hover{filter:brightness(1.15)}
.pill{background:var(--a);color:var(--bg);font-weight:700;border-radius:20px}
.ghost{background:var(--sf2)}
.danger{background:transparent;color:#ff6b6b}
.icon{background:transparent;color:var(--sub);padding:6px 8px;min-width:36px;min-height:36px;border-radius:18px}
.icon:hover{color:var(--tx);background:var(--sf2)}
.link{background:none;color:var(--a);padding:2px 4px;font-weight:600}
.muted{color:var(--sub)} .small{font-size:11px}
input[type=text],input[type=password],input[type=search],input:not([type]){
  background:var(--sf);border:1px solid var(--sf2);border-radius:14px;padding:10px 14px;width:100%;outline:none}
input:focus{border-color:var(--a)}
input[type=range]{accent-color:var(--a);width:100%}
input[type=checkbox]{accent-color:var(--a);width:18px;height:18px}
input[type=color]{width:96px;height:32px;border:0;border-radius:8px;background:none;padding:0}

.app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;background:var(--bg);
  padding-top:env(safe-area-inset-top)}
.views{flex:1;overflow:auto;padding:18px 18px 8px;-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}
h1{font-size:1.8em;margin:.2em 0 .5em;font-weight:800}
h2{font-size:1.15em;margin:1em 0 .5em;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--sf);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 32%,var(--bg)),var(--bg));
  border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:8px}
.hero-title{font-size:1.5em;font-weight:800}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.cover{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:rgba(10,14,8,.85);flex:none;font-size:22px}
.cover.sm{width:44px;height:44px;font-size:17px;border-radius:10px}
.cover.md{width:124px;height:124px;font-size:56px;border-radius:18px}
.cover.lg{width:100%;height:auto;aspect-ratio:1;font-size:28vmin;border-radius:24px}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.card-item{flex:none;width:140px;cursor:pointer}
.card-item .cover{width:140px;height:140px;font-size:56px;border-radius:16px}
.card-item .tt{margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.grid .card-item{width:auto}
.grid .card-item .cover{width:100%;height:auto;aspect-ratio:1}

.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--sf)}
.row.cur .tt{color:var(--a)}
.grow{flex:1;min-width:0}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart.on{color:#ff5c9a}.heart.on svg{fill:currentColor}
[data-icon]{display:inline-flex;flex:none}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}

.nav{display:flex;background:var(--bg);border-top:1px solid var(--sf);padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;color:var(--sub);font-size:11px;font-weight:600;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.nav button.on{color:var(--a)}

.mini{display:flex;align-items:center;gap:10px;background:var(--sf);border-top:1px solid var(--sf2);padding:8px 12px;cursor:pointer}
.mini .grow{flex:1}

#now{position:absolute;inset:0;display:none;flex-direction:column;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 22%,var(--bg)) 0%,var(--bg) 62%);overflow:auto}
#now.on{display:flex}
#nowCover{width:min(100%,340px);margin:0 auto}
.np-info{margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.np-info .grow{flex:1;min-width:0}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.play{background:var(--a);color:var(--bg);border-radius:32px;width:64px;height:64px;min-width:64px;padding:0}
.play:hover{filter:brightness(1.08)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px}
.vol input{max-width:220px}

#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:20px 20px 0 0;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  display:none;z-index:31;max-height:70%;overflow:auto}
#sheetBg.on,#sheet.on{display:block}
.sheet-btn{display:flex;width:100%;align-items:center;gap:10px;text-align:left;margin-bottom:6px;background:var(--sf2)}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--sf2);padding:10px 16px;
  border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* ===== РОЛИ / СБОРНИКИ / ФОРМЫ ===== */
.seg{display:flex;background:var(--sf);border-radius:14px;padding:4px;margin:16px 0 4px}
.seg button{flex:1;background:none;color:var(--sub);font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:11px}
.seg button.on{background:var(--sf2);color:var(--tx)}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--sf2);color:var(--sub)}
.badge.r-user{background:color-mix(in srgb,var(--sub) 30%,var(--bg));color:var(--tx)}
.badge.r-musician{background:#7aa2c8;color:#0d1c27}
.badge.r-junior_moderator{background:#9db36a;color:#1b2208}
.badge.r-moderator{background:#d8b45a;color:#2a2007}
.badge.r-senior_moderator{background:#d97a4a;color:#2b1205}
.badge.r-admin{background:#b06ad9;color:#1e0829}
.col-card{cursor:pointer}
.col-card .cover{position:relative}
.col-card .cover img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.col-tools{display:flex;align-items:center;gap:6px}
.dropzone{border:2px dashed var(--sf2);border-radius:14px;padding:16px;text-align:center;color:var(--sub);
  font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:10px}
.dropzone:hover{border-color:var(--a);color:var(--tx)}
.fld{margin:10px 0}
.fld>label{display:block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  color:var(--sub);margin-bottom:5px}
.fld textarea{background:var(--sf);border:1px solid var(--sf2);border-radius:14px;padding:10px 14px;width:100%;
  outline:none;font:inherit;color:inherit;resize:vertical;min-height:64px}
.fld textarea:focus{border-color:var(--a)}
.fld select{background:var(--sf);border:1px solid var(--sf2);border-radius:14px;padding:10px 12px;width:100%;
  outline:none;font:inherit;color:inherit}
.filelist{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:6px;word-break:break-word}
.user-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sf2)}
.user-row:last-child{border-bottom:0}
.user-row select{background:var(--sf2);border:0;border-radius:10px;padding:7px 9px;font:inherit;font-size:12px;color:inherit}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--bg);background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 40%,var(--bg)))}
.avatar.lg{width:52px;height:52px;font-size:20px}
.note{font-size:11.5px;line-height:1.5;color:var(--sub);background:var(--sf);border-radius:12px;padding:10px 12px;margin:10px 0}
.note b{color:var(--tx)}
#modalBg{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;z-index:34}
#modal{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:20px 20px 0 0;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:35;max-height:88%;overflow:auto}
#modalBg.on,#modal.on{display:block}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.auth-msg{font-size:12.5px;line-height:1.45;border-radius:12px;padding:9px 12px;margin:10px 0}
.auth-msg.err{background:color-mix(in srgb,#ff6b6b 18%,var(--bg));color:#ffb3b3}
.auth-msg.ok{background:color-mix(in srgb,var(--a) 18%,var(--bg));color:var(--a)}
.auth-terms{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--sub);margin:12px 0 4px;user-select:none}
.auth-terms input{flex:0 0 auto;margin-top:1px}
.auth-terms a,.note a{color:var(--a);font-weight:600}
.modal-actions button{flex:1}
.role-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--sf2);border-radius:3px}
</style>
</head>
<body>
<div class="app">
<div class="views">

  <section class="view on" id="v-home">
    <div class="top"><h1 id="greet">Привет</h1>
      <button class="icon" onclick="loadTracks()" title="Обновить список" data-icon="refresh" data-size="18"></button></div>
    <div class="muted small" id="homeStatus"></div>
    <div id="modeBanner" class="note hidden"></div>
    <div class="hero">
      <div>
        <div class="hero-title">Моя коллекция</div>
        <div class="muted small" id="heroSub"></div>
        <div class="btns">
          <button class="pill" onclick="playAll(false)"><span data-icon="play" data-size="15"></span>Играть всё</button>
          <button class="ghost" onclick="playAll(true)"><span data-icon="shuffle" data-size="15"></span>Перемешать</button>
          <button class="ghost hidden" id="heroUpload" onclick="openUploadForm()"><span data-icon="upload" data-size="15"></span>Загрузить</button>
        </div>
      </div>
      <div id="heroCover"></div>
    </div>
    <div class="seg" id="homeSeg">
      <button class="on" data-seg="tracks" onclick="setHomeSeg('tracks')">Треки</button>
      <button data-seg="collections" onclick="setHomeSeg('collections')">Сборники</button>
    </div>

    <div id="segTracks">
      <h2>Подборка</h2>
      <div class="hscroll" id="hscroll"></div>
      <h2>Все треки</h2>
      <div id="homeList"></div>
    </div>

    <div id="segCollections" class="hidden">
      <div class="top" style="margin:14px 0 6px">
        <h2 style="margin:0">Сборники</h2>
        <button class="pill hidden" id="newColBtn" onclick="openCollectionForm()"><span data-icon="folder-plus" data-size="15"></span>Создать</button>
      </div>
      <div class="muted small" id="colHint"></div>
      <div class="grid" id="colGrid" style="margin-top:12px"></div>
    </div>
  </section>

  <section class="view" id="v-search">
    <h1>Поиск</h1>
    <input type="search" id="q" placeholder="Название трека…" oninput="renderSearch()">
    <div id="searchList" style="margin-top:12px"></div>
  </section>

  <section class="view" id="v-library">
    <div id="plOverview">
      <div class="top"><h1>Медиатека</h1><button class="pill" onclick="createPl()"><span data-icon="plus" data-size="15"></span>Плейлист</button></div>
      <div class="muted small">Плейлисты и избранное хранятся в этом браузере.</div>
      <div class="grid" id="plGrid" style="margin-top:14px"></div>
    </div>
    <div id="plDetail" class="hidden">
      <div class="top">
        <button class="ghost" onclick="closeDetail()" title="Назад" data-icon="chevron-left" data-size="16"></button>
        <div class="btns" style="margin:0">
          <button class="ghost" id="plRen" onclick="renamePl()">Переименовать</button>
          <button class="danger" id="plDel" onclick="deletePl()">Удалить</button>
        </div>
      </div>
      <h2 id="plTitle"></h2>
      <div id="plList"></div>
      <div class="muted hidden" id="plEmpty" style="padding:20px 6px">Пока пусто. Нажмите кнопку меню (три точки) у трека, чтобы добавить его сюда.</div>
    </div>
  </section>

  <section class="view" id="v-settings">
    <h1>Настройки</h1>
    <div class="card">
      <div class="setrow"><span>Акцентный цвет</span><input type="color" id="cAcc" onchange="setPref('accent', this.value)"></div>
      <div class="setrow"><span>Фон</span><input type="color" id="cBg" onchange="setPref('bg', this.value)"></div>
      <div class="setrow"><span>Размер шрифта</span><input type="range" id="cFont" min="12" max="18" oninput="setPref('font', this.value)" style="max-width:150px"></div>
      <div class="setrow"><span>Автосохранение треков в кеш</span><input type="checkbox" id="cAuto" onchange="setPref('autoCache', this.checked)"></div>
      <div class="setrow"><span>Сервер</span><span class="muted small" id="srv"></span></div>
      <button class="ghost" style="width:100%" onclick="clearCache()"><span data-icon="trash" data-size="16"></span>Очистить кеш</button>
    </div>
    <div class="card hidden" id="installCard">
      <button class="pill hidden" id="installApp" style="width:100%" onclick="installApp()">Установить приложение</button>
      <div class="muted small" id="installStatus" style="margin-top:6px"></div>
    </div>
  </section>

  <section class="view" id="v-collection">
    <div class="top" style="margin-bottom:10px">
      <button class="ghost" onclick="closeCollection()" title="Назад" data-icon="chevron-left" data-size="16"></button>
      <div class="col-tools" id="colTools"></div>
    </div>
    <div id="colHead"></div>
    <div class="btns" id="colBtns" style="margin:10px 0 4px"></div>
    <div id="colTracks" style="margin-top:10px"></div>
  </section>

  <section class="view" id="v-profile">
    <h1>Профиль</h1>
    <div id="profileBox"></div>
  </section>

</div>

<div class="mini hidden" id="mini" onclick="openNow()">
  <div id="miniCover"></div>
  <div class="grow"><div class="tt" id="miniTitle"></div><div class="muted small" id="miniSub"></div></div>
  <button class="icon" onclick="event.stopPropagation();prev()" title="Назад" data-icon="skip-back" data-size="16"></button>
  <button class="icon" id="miniPlay" onclick="event.stopPropagation();togglePlay()" title="Играть/пауза" data-icon="play" data-size="16"></button>
  <button class="icon" onclick="event.stopPropagation();next()" title="Вперёд" data-icon="skip-forward" data-size="16"></button>
</div>

<div class="nav">
  <button data-view="home" onclick="showView('home')"><span class="ic" data-icon="home" data-size="20"></span>Главная</button>
  <button data-view="search" onclick="showView('search')"><span class="ic" data-icon="search" data-size="20"></span>Поиск</button>
  <button data-view="library" onclick="showView('library')"><span class="ic" data-icon="library" data-size="20"></span>Медиатека</button>
  <button data-view="settings" onclick="showView('settings')"><span class="ic" data-icon="sliders" data-size="20"></span>Настройки</button>
  <button data-view="profile" onclick="showView('profile')"><span class="ic" data-icon="user" data-size="20"></span>Профиль</button>
</div>

<div id="now">
  <div class="top">
    <button class="icon" onclick="closeNow()" title="Свернуть" data-icon="chevron-down" data-size="22"></button>
    <span></span>
    <span style="width:36px"></span>
  </div>
  <div id="nowCover"></div>
  <div class="np-info">
    <div class="grow"><div class="hero-title" id="nowTitle" style="font-size:1.2em"></div><div class="muted small" id="nowSub"></div></div>
    <button class="icon heart" id="nowHeart" onclick="S.cur && toggleFavTrack(S.cur)" title="В избранное"></button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0"
    oninput="S.seeking=true" onchange="seekTo(this.value)">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="icon" id="bShuf" title="Перемешивание" onclick="toggleShuffle()" data-icon="shuffle" data-size="20"></button>
    <button class="icon" onclick="prev()" title="Назад" data-icon="skip-back" data-size="22"></button>
    <button class="play" id="bPlay" onclick="togglePlay()" data-icon="play" data-size="24"></button>
    <button class="icon" onclick="next()" title="Вперёд" data-icon="skip-forward" data-size="22"></button>
    <button class="icon" id="bRep" title="Повтор" onclick="cycleRepeat()" data-icon="repeat" data-size="20"></button>
  </div>
  <div class="vol">
    <span class="muted" data-icon="volume" data-size="18"></span>
    <input type="range" id="vol" min="0" max="100" value="75" oninput="setVol(this.value)">
  </div>
</div>

<div id="sheetBg" onclick="closeSheet()"></div>
<div id="sheet"><div class="hero-title" id="sheetTitle" style="font-size:1em;margin-bottom:10px"></div><div id="sheetItems"></div></div>
<div id="modalBg" onclick="closeModal()"></div>
<div id="modal">
  <div class="hero-title" id="modalTitle" style="font-size:1.05em;margin-bottom:8px"></div>
  <div id="modalBody"></div>
</div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FAV = 'Избранное';
const API_BASE = '';

const I = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.3" y2="16.3"/>',
  library: '<path d="M4 4v16"/><path d="M8 8v12"/><path d="M12 6v14"/><path d="m16 6 4 14"/>',
  sliders: '<line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>',
  play: '<polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/>',
  pause: '<rect x="5.5" y="4" width="4.5" height="16" rx="1.5" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4.5" height="16" rx="1.5" fill="currentColor" stroke="none"/>',
  'skip-back': '<polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/>',
  'skip-forward': '<polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/>',

// localStorage недоступен в песочнице (sandbox="allow-scripts") — работаем через безопасные обёртки
const memLS = new Map();
const lsGet = k => { try { return window.localStorage.getItem(k); } catch { return memLS.has(k) ? memLS.get(k) : null; } };
const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch { memLS.set(k, v); } };
const LS = {
  get: (k, d) => { try { const v = lsGet(k); return v == null ? d : (JSON.parse(v) ?? d); } catch { return d; } },
  set: (k, v) => { try { lsSet(k, JSON.stringify(v)); } catch {} },
};

function hash(s){ let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function cover(seed, cls=''){
  const h = hash(String(seed || 'x')), hue = 70 + h % 110;
  const letter = (String(seed || '').trim()[0] || '♪').toUpperCase();
  return `<div class="cover ${cls}" style="background:linear-gradient(135deg,hsl(${hue} 90% 62%),hsl(${(hue+40)%360} 70% 24%))"><span>${esc(letter)}</span></div>`;
}
function fmt(sec){ const s = Math.floor(sec || 0); return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0'); }
function greet(){ const h = new Date().getHours();
  return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}

const DB = {
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('musicflow', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks');
        if (!d.objectStoreNames.contains('local')) d.createObjectStore('local');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async putLocal(k, v){ const db = await this.open(); return new Promise(res => {
    const tx = db.transaction('local', 'readwrite'); tx.objectStore('local').put(v, k); tx.oncomplete = () => res(); }); },
  async getLocal(k){ const db = await this.open(); return new Promise(res => {
    const q = db.transaction('local').objectStore('local').get(k);
    q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); },
  async delLocal(k){ const db = await this.open(); return new Promise(res => {
    const tx = db.transaction('local', 'readwrite'); tx.objectStore('local').delete(k); tx.oncomplete = () => res(); }); },
  async put(k, v){ const db = await this.open(); return new Promise(res => {
    const tx = db.transaction('tracks', 'readwrite'); tx.objectStore('tracks').put(v, k); tx.oncomplete = () => res(); }); },
  async del(k){ const db = await this.open(); return new Promise(res => {
    const tx = db.transaction('tracks', 'readwrite'); tx.objectStore('tracks').delete(k); tx.oncomplete = () => res(); }); },
  async keys(){ const db = await this.open(); return new Promise(res => {
    const q = db.transaction('tracks').objectStore('tracks').getAllKeys();
    q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); },
  async clear(){ const db = await this.open(); return new Promise(res => {
    const tx = db.transaction('tracks', 'readwrite'); tx.objectStore('tracks').clear(); tx.oncomplete = () => res(); }); },
};

async function api(path, o = {}){
  const init = {method: o.method || 'GET', credentials: 'include', headers: {}};
  if (o.json !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.json); }
  let r;
  try { r = await fetch(API_BASE + path, init); }
  catch { throw new Error('Нет связи с сервером. Проверьте интернет.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok){ const e = new Error(d.error || `Ошибка ${r.status}`); e.status = r.status; throw e; }
  return d;
}

async function loadTracks(){
  $('#homeStatus').textContent = 'Загружаем треки…';
  await detectBackend();
  try {
    // с модулем — расширенные метаданные, без модуля — старый публичный список /api/tracks
    const path = (S.server.ext && S.server.ext.tracks) ? EP.tracks : EP.tracksFallback;
    const d = await api(path);
    const list = Array.isArray(d) ? d : (d.tracks || []);
    mergeServerTracks(list);
    S.server.tracks = true;
    S.localOnly = false;
    S.lastSync = Date.now();
    $('#homeStatus').textContent = '';
  } catch (e) {
    S.server.tracks = false;
    S.localOnly = true;
    $('#homeStatus').textContent = 'Не удалось загрузить треки: ' + e.message;
  }
  renderAll();
  syncWithServer();
}

/* Определяем, что умеет сервер. Вызывается один раз на страницу и после входа/выхода.
   На старом бэкенде (только /api/tracks + /api/stream) это один запрос к /api/music/me,
   который вернёт 404 — и больше 404 в консоли не появляется. */
async function detectBackend(force){
  if (S.server.checked && !force) return S.server.ext;
  const caps = {music:false, tracks:false, collections:false, upload:false, me:false, canUpload:false, canModerate:false};
  try {
    const d = await api(EP.musicMe);          // 200 → модуль music-ext.js задеплоен
    caps.music = true;
    caps.tracks = true;
    caps.collections = true;
    caps.me = true;
    caps.canUpload = !!(d && d.can_upload);
    caps.canModerate = !!(d && d.can_moderate);
    // загрузка доступна, только если мы действительно вошли и сервер это подтвердил
    caps.upload = !!(d && d.loggedIn && d.can_upload);
  } catch (e) {
    if (e.status === 404 || e.status === 405) {
      // старый сервер: только список треков и стрим
      caps.tracks = false;                    // /api/music/tracks нет, берём /api/tracks
      caps.legacy = true;
    } else if (!e.status) {
      caps.offline = true;                    // нет связи вообще — не считаем «старым»
    }
  }
  S.server.ext = caps;
  S.server.checked = true;
  renderModeBanner();
  // на старом сервере загрузка/сборники живут только в браузере — прячем серверные кнопки
  const up = document.getElementById('heroUpload');
  if (up && caps.legacy) up.classList.add('hidden');
  return caps;
}

async function syncWithServer(){
  // подтягиваем сборники / роли / загрузки с сервера, если он это поддерживает
  const caps = S.server.ext || await detectBackend();
  if (caps.collections) {
    try {
      const c = await api(EP.collections);
      if (c && Array.isArray(c.collections)){
        S.collections = c.collections;
        S.server.collections = true;
      }
    } catch { /* модуль есть, но сборники не отдались — работаем локально */ }
  }
  try {
    const d = await api(EP.me);
    if (d && d.user){
      const roles = (Array.isArray(d.roles) && d.roles.length) ? d.roles : [d.user.role || 'user'];
      applyUser(d.user, roles);
      S.server.users = true;
    }
  } catch { /* гость / нет эндпоинта */ }
  saveLocal();
  await loadMusicFlags();
  renderAll();
  renderProfile();
}

  const sub = (cached ? '● в кеше · ' : '') + esc((t.ext || '').slice(1).toUpperCase());

    ? `<button class="icon danger" data-act="del" title="Удалить трек">${ic('trash', 17)}</button>`
    : '';
  return `<div class="row ${cur ? 'cur' : ''}" data-i="${i}">
    ${cover(t.name, 'sm')}
    <div class="grow"><div class="tt">${esc(t.name)}</div>
      <div class="muted small">${sub}</div></div>
    <button class="icon heart ${fav ? 'on' : ''}" data-act="fav" title="В избранное">${ic('heart', 18)}</button>

    <button class="icon" data-act="menu" title="Ещё">${ic('more', 18)}</button>
  </div>`;
}

    ? 'Вы можете создавать сборники. Треки сборников не показываются в «Все треки».' + support

  const cols = S.collections.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

function createPl(){

  if (pls[n]) return toast('Такой плейлист уже есть');
  pls[n] = []; savePls(); renderAll();
}
function renamePl(){
  const o = S.openPl; if (!o || o === FAV) return;
  const n = (prompt('Новое название:', o) || '').trim();
  if (!n || n === o) return;
  if (pls[n]) return toast('Такое название занято');
  pls[n] = pls[o]; delete pls[o]; S.openPl = n; savePls(); renderAll();
}
function deletePl(){
  const o = S.openPl; if (!o || o === FAV) return;
  if (!confirm(`Удалить «${o}»?`)) return;
  delete pls[o]; S.openPl = null; savePls(); renderAll();
}
function toggleFav(f){
  const a = pls[FAV]; const k = a.indexOf(f);
  if (k >= 0) a.splice(k, 1); else a.push(f);
  savePls(); renderAll();
}

function openMenu(t, pl){
  const fk = t.key || t.filename;
  const items = [{icon:'play-circle', label:'Играть', fn:() => playByFile(fk)}];

  if (isMusician() && S.collections.length){
    items.push({icon:'folder', label:'Добавить в сборник…', fn:() => pickCollection(t)});
    if (t.collectionId) items.push({icon:'x', label:'Убрать из «' + (colOf(t)?.title || '') + '»', fn:() => detachFromCollection(t)});
  }

  Object.keys(pls).forEach(n => items.push({icon:'plus-circle', label:'В «' + n + '»', fn:() => {
    if (!pls[n].includes(fk)) pls[n].push(fk);
    savePls(); renderAll(); toast('Добавлено в «' + n + '»');
  }}));
  if (pl && pl !== FAV) items.push({icon:'minus-circle', label:'Убрать из «' + pl + '»', fn:() => {
    pls[pl] = pls[pl].filter(x => x !== fk); savePls(); renderAll();
  }});

  if (S.cached.has(t.filename)) items.push({icon:'trash', label:'Удалить из кеша', fn:() => uncache(t)});
  else items.push({icon:'download', label:'Скачать в кеш', fn:() => cacheTrack(t, false)});

  if (canDeleteTrack(t)) items.push({icon:'trash', label:'Удалить трек', fn:() => requestDeleteTrack(t)});

  sheet(t.name, items);
}
function sheet(title, items){

async function cacheTrack(t, silent){
  if (S.cached.has(t.filename)) return;
  try {
    const r = await fetch(streamUrl(t), {credentials:'include'});
    if (!r.ok) throw new Error('сервер вернул ' + r.status);
    const blob = await r.blob();
    await DB.put(t.filename, blob);
    S.cached.add(t.filename);
    renderAll();
    if (!silent) toast('Сохранено в кеш');
  } catch (e) { if (!silent) toast('Не удалось скачать: ' + e.message); }
}
async function uncache(t){
  await DB.del(t.filename);
  S.cached.delete(t.filename); renderAll();
}
async function clearCache(){
  if (!confirm('Удалить все сохранённые треки?')) return;
  await DB.clear();
  S.cached = new Set(); renderAll(); toast('Кеш очищен');
}

function renderSettings(){

function bindAudio(){
  const a = $('#audio');
  a.volume = prefs.volume / 100;
  $('#vol').value = prefs.volume;
  a.addEventListener('play', syncPlay);
  a.addEventListener('pause', syncPlay);
  a.addEventListener('timeupdate', () => {
    if (!S.seeking && a.duration) $('#seek').value = a.currentTime / a.duration * 1000;
    $('#tCur').textContent = fmt(a.currentTime);
    $('#tDur').textContent = fmt(a.duration);

function syncPlay(){
  const playing = !$('#audio').paused;
  $('#bPlay').innerHTML = ic(playing ? 'pause' : 'play', 24);
  $('#miniPlay').innerHTML = ic(playing ? 'pause' : 'play', 16);
}
function onEnded(){
  const t = S.cur; if (!t) return;
  if (prefs.autoCache && !S.cached.has(t.filename)) cacheTrack(t, true);
  if (prefs.repeat === 'one'){ const a = $('#audio'); a.currentTime = 0; a.play().catch(() => {}); return; }
  next();
}

function playList(arr, i){
  if (!arr.length) return;
  S.queue = arr.slice(); S.qi = i; startCurrent();
}
function playAll(shuffle){
  const pool = visibleTracks();
  if (!pool.length) return toast('Нет треков для воспроизведения');
  const q = pool.slice();
  if (shuffle) q.sort(() => Math.random() - 0.5);
  playList(q, 0);
}
function playByFile(f){
  const pool = visibleTracks();
  const i = pool.findIndex(t => (t.key || t.filename) === f || t.filename === f || t.id === f);
  if (i >= 0) playList(pool, i);
}

function tracksOfCollection(id){
  return S.tracks.filter(t => t.collectionId === id);
}
function playCollection(id){
  const list = tracksOfCollection(id);
  if (!list.length) return toast('В сборнике пока нет треков');
  playList(list, 0);
  toast('Играет сборник: ' + (collectionById(id) || {}).title);
}
function startCurrent(){
  const t = S.queue[S.qi]; if (!t) return;
  if (!streamUrl(t)) { toast('Файл трека недоступен'); }
  S.cur = t;
  const a = $('#audio');
  a.src = streamUrl(t);
  a.play().catch(() => {});
  $('#seek').value = 0;
  renderAll();
}
function togglePlay(){
  if (!S.cur) return playAll(false);
  const a = $('#audio');
  if (a.paused) a.play().catch(() => {}); else a.pause();
}
function next(){
  if (!S.queue.length) return;
  let i;
  if (prefs.shuffle && S.queue.length > 1){
    do { i = Math.floor(Math.random() * S.queue.length); } while (i === S.qi);
  } else if (S.qi + 1 < S.queue.length){
    i = S.qi + 1;
  } else if (prefs.repeat === 'all'){
    i = 0;
  } else {
    $('#audio').pause(); return;
  }
  S.qi = i; startCurrent();
}
function prev(){
  const a = $('#audio');
  if (a.currentTime > 3){ a.currentTime = 0; return; }
  if (S.qi > 0) S.qi--;
  else if (prefs.repeat === 'all') S.qi = S.queue.length - 1;
  startCurrent();
}
function seekTo(v){
  const a = $('#audio');

}
function setVol(v){

/* =========================================================================
   РОЛИ, СБОРНИКИ, ЗАГРУЗКА, УДАЛЕНИЕ
   Иерархия: user < musician < junior_moderator < moderator < senior_moderator < admin
   ========================================================================= */
const ROLES = {
  user:             {rank:0, label:'Слушатель'},
  musician:         {rank:1, label:'Музыкант'},
  junior_moderator: {rank:2, label:'Мл. модератор'},
  moderator:        {rank:3, label:'Модератор'},
  senior_moderator: {rank:4, label:'Ст. модератор'},
  admin:            {rank:5, label:'Админ'},
};
/* эндпоинты Mell Footage (см. api-docs) + расширение music-ext.js */
const EP = {
  me: '/api/me',
  login: '/api/login',
  logout: '/api/logout',
  registerStart: '/api/register/email/start',
  registerConfirm: '/api/register/email/confirm',
  tracks: '/api/music/tracks',
  tracksFallback: '/api/tracks',
  collections: '/api/music/collections',
  upload: '/api/tracks',
  stream: '/api/stream/',
  users: '/api/admin/users',
  musicMe: '/api/music/me',
};
const rankOf = r => (ROLES[r] ? ROLES[r].rank : -1);
const roleLabel = r => (ROLES[r] ? ROLES[r].label : r);

let localCols = LS.get('mf.cols', []);
let localTracksMeta = LS.get('mf.tracks', []);
let localUsers = LS.get('mf.users', []);
let hiddenIds = LS.get('mf.hidden', []);
S.localTracks = [];
S.collections = localCols;
S.blobs = new Map();

function loadLocal(){
  S.user = LS.get('mf.user', null);
  S.roles = LS.get('mf.roles', S.user ? [S.user.role] : []);
  S.collections = localCols;
  S.localTracks = localTracksMeta.map(t => Object.assign({}, t, {local:true, key:t.id, ext:t.ext || '.mp3'}));
  rebuildTracks();
}

function saveLocal(){
  LS.set('mf.cols', S.collections.filter(c => c.local !== false || true));
  LS.set('mf.tracks', S.localTracks.map(({local, key, ...rest}) => rest));
  LS.set('mf.user', S.user);
  LS.set('mf.roles', S.roles);
  LS.set('mf.hidden', hiddenIds);
  LS.set('mf.users', localUsers);
}

function rebuildTracks(){
  const server = (S.serverTracks || []).filter(t => !hiddenIds.includes(t.id));
  S.tracks = S.localTracks.concat(server);
}

function myRank(){ return S.user ? Math.max(...(S.roles && S.roles.length ? S.roles.map(rankOf) : [rankOf(S.user.role)])) : -1; }
/* флаги с сервера: users.is_musician и права на модерацию */
function isMusician(){ return myRank() >= ROLES.musician.rank || !!(S.flags && S.flags.musician); }
function canModerate(){ return myRank() >= ROLES.senior_moderator.rank || !!(S.flags && S.flags.moderate); }
function isAdmin(){ return (S.user && S.user.role === 'admin') || !!(S.flags && S.flags.admin); }

async function loadMusicFlags(){
  if (!S.user){ S.flags = {musician:false, moderate:false, admin:false}; return; }
  const caps = S.server.ext || await detectBackend();
  if (!caps.music){
    // старый сервер: роль есть только в /api/me, загрузки и сборников на сервере нет
    S.flags = {musician:false, moderate:false, admin: S.user.role === 'admin'};
    renderAll(); renderProfile();
    return;
  }
  try {
    const d = await api(EP.musicMe);
    S.flags = {
      musician: !!(d && (d.is_musician || d.can_upload)),
      moderate: !!(d && d.can_moderate),
      admin: !!(d && d.can_manage_roles) || (S.user.role === 'admin'),
    };
  } catch {
    S.flags = {musician:false, moderate:false, admin: S.user.role === 'admin'};
  }
  renderAll(); renderProfile();
}
function isFavFile(t){ return isFav(t); }

function visibleTracks(){ return S.tracks.filter(t => !t.collectionId); }
function collectionById(id){ return S.collections.find(c => String(c.id) === String(id)) || null; }
function colOf(t){ return t.collectionId ? collectionById(t.collectionId) : null; }

function canDeleteTrack(t){
  if (!S.user || !t) return false;
  if (canModerate()) return true;
  return t.uploadedBy && S.user.id && (t.uploadedBy === S.user.id || t.uploadedByName === S.user.username);
}
function canDeleteCollection(c){
  if (!S.user || !c) return false;
  if (canModerate()) return true;
  return c.createdBy && S.user.id && (c.createdBy === S.user.id || c.authorName === S.user.username);
}

function streamUrl(t){
  if (!t) return '';
  if (t.local) return S.blobs.get(t.id) || '';
  if (t.url) return t.url;
  return API_BASE + EP.stream + encodeURIComponent(t.filename);
}

function mergeServerTracks(list){
  S.serverTracks = (list || []).filter(Boolean).map(t => {
    const id = (t.id !== undefined && t.id !== null && t.id !== '') ? String(t.id) : (t.filename || t.name);
    const filename = t.filename || (t.url ? decodeURIComponent(String(t.url).split('/').pop()) : id);
    return Object.assign({}, t, {
      id,
      key: id,
      filename,
      ext: t.ext || extOf(filename),
      url: t.url || (EP.stream + encodeURIComponent(filename)),
    });
  });
  rebuildTracks();
}

function localCacheHasTracks(){ return S.localTracks.length > 0; }

function applyUser(user, roles){
  S.user = user;
  S.roles = (Array.isArray(roles) && roles.length) ? roles : [user.role || 'user'];
  if (user.is_musician) S.flags = Object.assign({}, S.flags, {musician:true});
  saveLocal();
  renderProfile();
  renderAll();
  loadMusicFlags();
}

async function refreshRoles(){
  try {
    const d = await api(EP.me);
    const u = d && d.user;
    if (!u){
      if (S.user && d && d.loggedIn === false){          // сессия истекла на сервере
        S.user = null; S.roles = []; saveLocal(); renderProfile(); renderAll();
      }
      return;
    }
    const roles = (Array.isArray(d.roles) && d.roles.length) ? d.roles : [u.role || 'user'];
    const changed = !S.user || S.user.id !== u.id || S.user.role !== u.role ||
      S.user.username !== u.username || (S.roles || []).join() !== roles.join();
    if (changed) applyUser(u, roles);
  } catch { /* гость или сервер без /api/me */ }
}

/* ------------------------- загрузка локальных блобов ------------------------- */
async function initLocalMedia(){
  for (const t of S.localTracks){
    if (S.blobs.has(t.id)) continue;
    try {
      const blob = await DB.getLocal(t.id);
      if (blob) S.blobs.set(t.id, URL.createObjectURL(blob));
    } catch {}
  }
  renderAll();
}

/* ------------------------------- утилиты ------------------------------- */
function uid(p){ return (p || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function cleanName(fn){ return String(fn || 'track').replace(/\.[^./\\]+$/, '').replace(/[_]+/g, ' ').trim(); }
function extOf(fn){ const m = String(fn).match(/\.[^./\\]+$/); return m ? m[0].toLowerCase() : '.mp3'; }
function fmtSize(b){ if (!b) return ''; const mb = b / 1048576; return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function readAsDataURL(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
async function shrinkImage(file, max){
  const url = await readAsDataURL(file);
  if (!/^image\//.test(file.type || '') || file.size < 60000) return url;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, (max || 420) / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { res(c.toDataURL('image/jpeg', 0.82)); } catch { res(url); }
    };
    img.onerror = () => res(url);
    img.src = url;
  });
}

/* ------------------------------ вход ------------------------------ */
async function doLogin(){
  const username = ($('#auName') && $('#auName').value || '').trim();
  const password = ($('#auPass') && $('#auPass').value) || '';
  if (!username) return authStatus('Введите логин');
  if (!password) return authStatus('Введите пароль');
  authBusy(true, 'Входим…'); authStatus('');
  try {
    const d = await api(EP.login, {method:'POST', json:{username, password}});
    if (!d || !d.user) throw new Error('Сервер не вернул профиль');
    closeModal();
    applyUser(d.user, d.roles);
    S.server.users = true;
    toast('С возвращением, ' + d.user.username);
    refreshRoles();
  } catch (e){
    authBusy(false);
    if (e.status === 401 || e.status === 400 || e.status === 403) {
      return authStatus(e.message || 'Неверный логин или пароль');
    }
    // сервер недоступен — локальный вход только по аккаунтам, созданным в этом браузере
    const u = localUsers.find(x => x.username.toLowerCase() === username.toLowerCase() && x.password === password);
    if (u){
      closeModal(); applyUser(user0(u), [u.role]);
      S.localOnly = true;
      toast('Сервер недоступен: вход только в этом браузере');
      return;
    }
    authStatus('Нет связи с сервером. Войти можно только в аккаунт, созданный в этом браузере.', 'err');
  }
}

/* --------------------------- регистрация --------------------------- */
async function startRegister(){
  const username = ($('#auName').value || '').trim();
  const email = ($('#auEmail').value || '').trim().toLowerCase();
  const password = $('#auPass').value || '';
  const password2 = $('#auPass2').value || '';
  const terms = $('#auTerms').checked;

  if (!username || !email || !password) return authStatus('Заполните все поля!');
  if (!terms) return authStatus('Необходимо принять условия использования и политику конфиденциальности.');
  if (username.length < 3 || username.length > 15) return authStatus('Логин: от 3 до 15 символов, без пробелов.');
  if (!/^[a-zA-Z0-9_-]+$/.test(username)) return authStatus('Логин: только латинские буквы, цифры, _ и -.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return authStatus('Некорректный email.');
  if (password.length < 6) return authStatus('Пароль минимум 6 символов');
  if (password !== password2) return authStatus('Пароли не совпадают');

  authBusy(true, 'Отправляем код…'); authStatus('');
  try {
    const d = await api(EP.registerStart, {method:'POST', json:{username, email, password, accept_terms:true}});
    openConfirmCode({username, email, password, message: (d && d.message) || 'Код отправлен на почту'});
  } catch (e){
    authBusy(false);
    if (e.status) return authStatus(e.message || 'Не удалось отправить код');
    return authStatus('Нет связи с сервером — регистрация возможна только на сервере.', 'err');
  }
}

function openConfirmCode(ctx){
  const o = ctx || {};
  openModal('Подтверждение почты', `
    <div class="muted small" style="margin-bottom:10px">
      Письмо отправлено на <b>${esc(o.email || '')}</b>. Введите код из письма — он действует 10 минут.</div>
    <div class="fld"><label>Код из письма</label>
      <input type="text" id="auCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"
        style="letter-spacing:6px;text-align:center;font-weight:800;font-size:20px"></div>
    <div class="auth-msg hidden" id="auMsg"></div>
    <div class="note">После подтверждения вы войдёте в аккаунт с ролью <b>слушатель</b>.</div>
  `, [
    {label:'Назад', kind:'ghost', fn:() => openAuthScreen('register', {username:o.username, email:o.email})},

async function confirmRegister(ctx){
  const code = (($('#auCode') && $('#auCode').value) || '').trim();
  if (!/^\d{6}$/.test(code)) return authStatus('Введите 6 цифр из письма');
  authBusy(true, 'Проверяем…'); authStatus('');
  try {
    await api(EP.registerConfirm, {method:'POST', json:{email: (ctx && ctx.email) || '', code}});
    const username = (ctx && ctx.username) || '';
    const password = (ctx && ctx.password) || '';
    // сразу входим тем же логином/паролем — но пароль мог быть введён на прошлом шаге, поэтому
    // запрашиваем его заново только если он неизвестен
    if (password && username){
      try {
        const d = await api(EP.login, {method:'POST', json:{username, password}});
        if (d && d.user){ closeModal(); applyUser(d.user, d.roles); toast('Аккаунт создан: ' + d.user.username); return; }
      } catch {}
    }
    closeModal();
    toast('Аккаунт создан — войдите с логином и паролем');
    openAuthScreen('login', {username});
  } catch (e){
    authBusy(false);
    authStatus(e.status ? (e.message || 'Неверный код подтверждения') : 'Нет связи с сервером');
  }
}

async function uploadTracks(){
  if (!requireRole(ROLES.musician.rank)) return;
  const input = $('#upFiles');
  const files = [...(input.files || [])];
  if (!files.length) return toast('Выберите хотя бы один файл');
  const artist = ($('#upArtist').value || '').trim();
  const collectionId = $('#upCol').value || null;
  const nameField = ($('#upName').value || '').trim();

  closeModal();
  toast('Загружаем: ' + files.length + ' файл(ов)…');

  for (const file of files){
    const name = files.length === 1 ? (nameField || cleanName(file.name)) : cleanName(file.name);
    const okServer = await tryServerUpload(file, {name, artist, collectionId});
    if (okServer) continue;

    const id = uid('trk');
    try { await DB.putLocal(id, file); } catch (e) { toast('Не удалось сохранить файл локально'); break; }
    S.blobs.set(id, URL.createObjectURL(file));
    const meta = {
      id, name, artist, filename: file.name, ext: extOf(file.name), size: file.size,
      collectionId, uploadedBy: S.user.id, uploadedByName: S.user.username, createdAt: Date.now(), local: true,
    };
    localTracksMeta.push(meta);
    S.localTracks.push(Object.assign({}, meta, {key: id}));
  }
  saveLocal(); rebuildTracks(); renderAll();
  if (S.openCol) renderCollection();
  toast('Готово: загружено ' + files.length);
}

async function tryServerUpload(file, meta){
  try {
    const fd = new FormData();
    fd.append('audioFile', file, file.name);      // как videoFile в /admin/upload
    fd.append('name', meta.name);
    fd.append('artist', meta.artist || '');
    if (meta.collectionId) fd.append('collectionId', meta.collectionId);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(API_BASE + EP.upload, {method:'POST', body:fd, credentials:'include', signal:ctrl.signal});
    clearTimeout(timer);
    if (!r.ok) return false;
    const d = await r.json().catch(() => ({}));
    if (d && (d.track || d.filename)){
      const t = d.track || {name: meta.name, filename: d.filename, ext: extOf(d.filename)};
      mergeServerTracks((S.serverTracks || []).concat([Object.assign({collectionId: meta.collectionId}, t)]));
      saveLocal(); renderAll();
      return true;
    }
    return false;
  } catch { return false; }
}

/* ------------------------------- удаление ------------------------------- */

/* --- запросы к серверу: пробуем по id, затем по имени файла --- */
async function serverCall(paths, opts){
  for (const path of paths){
    try { const d = await api(path, opts || {}); return {ok:true, data:d, path}; }
    catch (e) {
      if (e.status === 404 || e.status === 405) continue;   // другой идентификатор / нет метода
      return {ok:false, error:e};
    }
  }
  return {ok:false, error:new Error('Сервер не поддерживает музыку: /api/music/* отвечает 404')};
}
const trackPaths = t => ['/api/music/tracks/' + encodeURIComponent(t.filename || t.id),
                         '/api/tracks/' + encodeURIComponent(t.filename || t.id)];

function requestDeleteTrack(t){
  const extra = t.collectionId ? '\nТрек будет удалён и из сборника.' : '';
  openModal('Удалить трек?', `<div class="muted small" style="line-height:1.6">«${esc(t.name)}»${extra ? '<br>Трек исчезнет и из сборника.' : ''}</div>`, [
    {label:'Отмена', kind:'ghost', fn:() => closeModal()},
    {label:'Удалить', kind:'danger', fn:() => doDeleteTrack(t)},
  ]);
}

async function doDeleteTrack(t){
  closeModal();
  if (!canDeleteTrack(t)) return toast('Нет прав: удалять может автор или старший админ и выше');

  if (t.local){
    await DB.delLocal(t.id);
    const url = S.blobs.get(t.id);
    if (url) { try { URL.revokeObjectURL(url); } catch {} S.blobs.delete(t.id); }
    localTracksMeta = localTracksMeta.filter(m => m.id !== t.id);
    S.localTracks = S.localTracks.filter(x => x.id !== t.id);
  } else {
    const del = await serverCall(trackPaths(t), {method:'DELETE'});
    const serverOk = !!del.ok;
    if (!serverOk){
      hiddenIds.push(t.id);   // скрываем у себя, но на сервере трек остаётся
      toast('Сервер не удалил трек (нужен DELETE /api/tracks/:id) — скрыто локально');
    }
    S.serverTracks = (S.serverTracks || []).filter(x => x.id !== t.id);
    pls[FAV] = pls[FAV].filter(f => f !== t.id && f !== t.filename);
    Object.keys(pls).forEach(n => { pls[n] = pls[n].filter(f => f !== t.id && f !== t.filename); });
    savePls();
  }

  if (S.cur && S.cur.id === t.id){
    $('#audio').pause(); $('#audio').removeAttribute('src');
    S.cur = null; S.queue = []; S.qi = -1;
  }
  saveLocal(); rebuildTracks(); renderAll();
  if (S.openCol) renderCollection();
  toast('Трек удалён');
}

function requestDeleteCollection(c){
  if (typeof c !== 'object' || c === null) c = collectionById(c);
  if (!c) return toast('Сборник не найден');
  const n = tracksOfCollection(c.id).length;
  openModal('Удалить сборник?', `<div class="muted small" style="line-height:1.6">«${esc(c.title)}»<br>
    Вместе с ним удалятся все его треки (${n} шт.).</div>`, [
    {label:'Отмена', kind:'ghost', fn:() => closeModal()},
    {label:'Удалить', kind:'danger', fn:() => doDeleteCollection(c)},
  ]);
}

async function doDeleteCollection(c){
  if (typeof c !== 'object' || c === null) c = collectionById(c);
  if (!c) return toast('Сборник не найден');
  closeModal();
  if (!canDeleteCollection(c)) return toast('Нет прав: удалять сборник может автор или старший админ и выше');
  const tracks = tracksOfCollection(c.id);

  let serverRemoved = false;
  if (c.local !== true){
    // сервер удалит и сборник, и его треки (?withTracks=1)
    const del = await serverCall(['/api/music/collections/' + encodeURIComponent(c.id) + '?withTracks=1'], {method:'DELETE'});
    serverRemoved = !!del.ok;
    if (!del.ok) toast('Сервер не удалил сборник (нужен DELETE /api/music/collections/:id)');
  }
  for (const t of tracks){
    if (t.local){
      await DB.delLocal(t.id);
      const url = S.blobs.get(t.id);
      if (url) { try { URL.revokeObjectURL(url); } catch {} S.blobs.delete(t.id); }
      localTracksMeta = localTracksMeta.filter(m => m.id !== t.id);
      S.localTracks = S.localTracks.filter(x => x.id !== t.id);
    } else {
      if (!serverRemoved){                       // каскад уже сделан на сервере — повторно не бьём
        const del = await serverCall(trackPaths(t), {method:'DELETE'});
        if (!del.ok) hiddenIds.push(t.id);
      }
      S.serverTracks = (S.serverTracks || []).filter(x => x.id !== t.id);
    }
    if (S.cur && S.cur.id === t.id){ $('#audio').pause(); S.cur = null; S.queue = []; S.qi = -1; }
  }

  S.collections = S.collections.filter(x => String(x.id) !== String(c.id));
  saveLocal(); rebuildTracks(); renderAll();
  closeCollection();
  toast('Сборник удалён');
}

init().catch(e => toast('Ошибка запуска: ' + e.message));
</script>
</body>
</html>
