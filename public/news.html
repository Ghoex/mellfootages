<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">Новости</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #3f4d3d; 
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #a3b899;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-links a {
            color: #1e2920;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-right: 20px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-select {
            background-color: #6b7f67;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        .lang-select option {
            background-color: #3f4d3d;
            color: #ffffff;
        }

        #user-info {
            color: #1e2920;
            font-weight: 500;
        }

        .logout-btn {
            background-color: #6b7f67;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: #556652;
        }

        .main-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .page-title {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 2.2rem;
            text-align: center;
            color: #ffffff;
        }

        /* АДМИН-ПАНЕЛЬ СОЗДАНИЯ НОВОСТИ */
        .admin-section {
            background-color: #c2d4bc;
            border-radius: 12px;
            padding: 20px;
            color: #1e2920;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .admin-section h3 {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .admin-section form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-section input[type="text"],
        .admin-section textarea {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #a3b899;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 1rem;
            color: #1e2920;
            outline: none;
        }

        .admin-section textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9rem;
            color: #2d3b2c;
        }

        .submit-btn {
            background-color: #6b7f67;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: #556652;
            transform: translateY(-1px);
        }

        /* ЛЕНТА НОВОСТЕЙ */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background-color: #c2d4bc;
            border-radius: 10px;
            padding: 20px;
            color: #1e2920;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-card h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .news-card .news-date {
            font-size: 0.85rem;
            color: #4b5d49;
        }

        .news-card img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 5px;
        }

        .news-card p {
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .status-message {
            text-align: center;
            color: #c2d4bc;
            font-size: 1.1rem;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="/" data-i18n="navHome">Главная</a>
            <a href="/news" data-i18n="navNews">Новости</a>
        </nav>
        
        <div class="header-controls">
    
            <select id="language-select" class="lang-select">
                <option value="ru">RU</option>
                <option value="uk">UA</option>
                <option value="en">EN</option>
            </select>
            <div id="user-info"></div>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title" data-i18n="pageTitle">Новости</h1>
        
        <div id="admin-form-container" class="admin-section" style="display: none;">
            <h3 data-i18n="adminTitle">Опубликовать новость</h3>
            <form id="add-news-form">
                <input type="text" id="news-title" data-i18n-ph="phTitle" placeholder="Заголовок..." required>
                <textarea id="news-content" data-i18n-ph="phContent" placeholder="Текст новости..." required></textarea>
                
                <div class="file-input-wrapper">
                    <label data-i18n="imageLabel">Картинка к новости:</label>
                    <input type="file" id="news-image" accept="image/*">
                </div>

                <button type="submit" class="submit-btn" data-i18n="publishBtn">Опубликовать</button>
            </form>
        </div>

     
        <div id="news-container" class="news-list"></div>
    </div>

    <script>
   
        const translations = {
            ru: {
                pageTitle: "Новости",
                navHome: "Главная",
                navNews: "Новости",
                adminTitle: "Опубликовать новость",
                phTitle: "Заголовок...",
                phContent: "Текст новости...",
                imageLabel: "Картинка к новости:",
                publishBtn: "Опубликовать",
                greeting: "Привет",
                logout: "Выйти",
                login: "Войти",
                noNews: "Новостей пока нет.",
                imgAlt: "Новостное фото",
                saveError: "Ошибка при сохранении новости"
            },
            uk: {
                pageTitle: "Новини",
                navHome: "Головна",
                navNews: "Новини",
                adminTitle: "Опублікувати новину",
                phTitle: "Заголовок...",
                phContent: "Текст новини...",
                imageLabel: "Зображення до новини:",
                publishBtn: "Опублікувати",
                greeting: "Привіт",
                logout: "Вийти",
                login: "Увійти",
                noNews: "Новин поки немає.",
                imgAlt: "Новинне фото",
                saveError: "Помилка під час збереження новини"
            },
            en: {
                pageTitle: "News",
                navHome: "Home",
                navNews: "News",
                adminTitle: "Publish News",
                phTitle: "Title...",
                phContent: "News content...",
                imageLabel: "News image:",
                publishBtn: "Publish",
                greeting: "Hello",
                logout: "Logout",
                login: "Login",
                noNews: "No news yet.",
                imgAlt: "News photo",
                saveError: "Error saving news"
            }
        };

        let currentLang = localStorage.getItem('app_lang') || 'en';
        let currentUserData = null;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.getElementById('language-select').value = lang;

            const t = translations[lang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (t[key]) el.placeholder = t[key];
            });

            if (currentUserData) renderUserInfo(currentUserData);
            loadNews();
        }

        function renderUserInfo(data) {
            const userInfo = document.getElementById('user-info');
            const t = translations[currentLang];
            
            if (data.loggedIn) {
                userInfo.innerHTML = `${t.greeting}, <b>${data.user.username}</b>! <button onclick="logout()" class="logout-btn">${t.logout}</button>`;
                if (data.user.role === 'admin') {
                    document.getElementById('admin-form-container').style.display = 'block';
                }
            } else {
                userInfo.innerHTML = `<a href="/auth" style="color:#1e2920; font-weight:bold; text-decoration:none;">${t.login}</a>`;
            }
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                currentUserData = await res.json();
                renderUserInfo(currentUserData);
            } catch (e) {
                renderUserInfo({ loggedIn: false });
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        async function loadNews() {
            const container = document.getElementById('news-container');
            const t = translations[currentLang];

            try {
                const res = await fetch('/api/news');
                const news = await res.json();
                container.innerHTML = '';

                if (!news || news.length === 0) {
                    container.innerHTML = `<div class="status-message">${t.noNews}</div>`;
                    return;
                }

                news.forEach(item => {
                    const card = document.createElement('article');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <h2>${item.title}</h2>
                        <span class="news-date">${item.date}</span>
                        ${item.image ? `<img src="${item.image}" alt="${t.imgAlt}">` : ''}
                        <p>${item.content}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = `<div class="status-message">${t.noNews}</div>`;
            }
        }

        document.getElementById('language-select').addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        document.getElementById('add-news-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('title', document.getElementById('news-title').value);
            formData.append('content', document.getElementById('news-content').value);

            const fileInput = document.getElementById('news-image');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            const res = await fetch('/api/news', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('add-news-form').reset();
                loadNews();
            } else {
                alert(data.error || translations[currentLang].saveError);
            }
        });

        setLanguage(currentLang);
        checkAuth();
    </script>
</body>
</html>
